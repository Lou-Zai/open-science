name: finalize macOS notarization

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: finalize-macos-notarization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MACOS_NOTARIZATION_TIMEOUT_SECONDS: 60
      MACOS_NOTARIZATION_POLL_SECONDS: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate release credentials
        shell: bash
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Finalize ready apps in draft releases
        id: finalize
        shell: bash
        run: |
          queue=$(gh api --method GET "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            [.[] | select(.draft) | . as $release | .assets[]
              | select(.name | endswith(".submitted.app.zip"))
              | {
                  tag: $release.tag_name,
                  asset_id: .id,
                  asset_name: .name,
                  final_name: (.name | sub("\\.submitted\\.app\\.zip$"; ".dmg"))
                }
            ]')

          if [ "$(jq length <<<"$queue")" -eq 0 ]; then
            echo "No submitted macOS apps are waiting in draft releases."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          output_dir="$RUNNER_TEMP/finalized-macos"
          mkdir -p "$output_dir"
          produced=false

          while IFS= read -r item; do
            tag=$(jq -r '.tag' <<<"$item")
            asset_id=$(jq -r '.asset_id' <<<"$item")
            asset_name=$(jq -r '.asset_name' <<<"$item")
            final_name=$(jq -r '.final_name' <<<"$item")

            existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$final_name\") | .id")
            if [ -n "$existing" ]; then
              echo "Final DMG already exists for $asset_name; removing the queue asset."
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              continue
            fi

            item_dir="$RUNNER_TEMP/notarization-$asset_id"
            archive_path="$item_dir/$asset_name"
            extract_dir="$item_dir/app"
            dmg_path="$output_dir/$final_name"
            mkdir -p "$extract_dir"

            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$archive_path"
            ditto -x -k "$archive_path" "$extract_dir"
            app_path=$(find "$extract_dir" -maxdepth 1 -type d -name '*.app' -print -quit)
            if [ -z "$app_path" ]; then
              echo "::error::No app bundle found in $asset_name"
              exit 1
            fi

            if ! xcrun stapler staple "$app_path"; then
              echo "::notice::Apple is still processing $asset_name; a later scheduled run will retry."
              continue
            fi

            bash scripts/release/finalize-macos-notarization.sh "$app_path" "$dmg_path"
            gh release upload "$tag" "$dmg_path" --clobber
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            produced=true
          done < <(jq -c '.[]' <<<"$queue")

          echo "produced=$produced" >> "$GITHUB_OUTPUT"

      - name: Upload finalized macOS installers
        if: steps.finalize.outputs.produced == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finalized-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/finalized-macos/*.dmg
          if-no-files-found: error
